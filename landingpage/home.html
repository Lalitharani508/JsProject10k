<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./landing.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./landing.css">

</head>
<body>
    <script src="./landing.js"></script>

    <h1></h1>
    <center> <h1>Categories</h1></center>

    <div class="container my-5">
      <h2 class="text-center mb-4">What are you looking for?</h2>
      <div class="carousel-container">
        <!-- Carousel Wrapper -->
        <div class="carousel-wrapper" id="categoryCarousel">
          <!-- Category Cards -->
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Bank')">
            <i class="fas fa-university category-icon"></i>
            <div class="category-title">Bank</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Travel Insurance')">
            <i class="fas fa-plane category-icon"></i>
            <div class="category-title">Travel Insurance</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Car Dealer')">
            <i class="fas fa-car category-icon"></i>
            <div class="category-title">Car Dealer</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Furniture Store')">
            <i class="fas fa-couch category-icon"></i>
            <div class="category-title">Furniture Store</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Jewelry Store')">
            <i class="fas fa-gem category-icon"></i>
            <div class="category-title">Jewelry Store</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Clothing Store')">
            <i class="fas fa-tshirt category-icon"></i>
            <div class="category-title">Clothing Store</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Electronics')">
            <i class="fas fa-laptop category-icon"></i>
            <div class="category-title">Electronics</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Fitness')">
            <i class="fas fa-dumbbell category-icon"></i>
            <div class="category-title">Fitness</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Home Services')">
            <i class="fas fa-home category-icon"></i>
            <div class="category-title">Home Services</div>
          </div>
          <div class="category-card animate__animated animate__fadeIn" onclick="showAlert('Tech Services')">
            <i class="fas fa-tools category-icon"></i>
            <div class="category-title">Tech Services</div>
          </div>
        </div>
        <!-- Navigation Arrows -->
        <button class="carousel-nav left" onclick="scrollLeft()"><i class="fas fa-chevron-left"></i></button>
        <button class="carousel-nav right" onclick="scrollRight()"><i class="fas fa-chevron-right"></i></button>
      </div>
      <!-- See More Button -->
      <div class="text-center mt-3">
        <button class="see-more-btn" onclick="showSeeMore()">See More</button>
      </div>
  </div>


</body>

</html>
