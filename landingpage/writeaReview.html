<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .search-bar input {
      width: 100%;
      padding: 15px 50px 15px 20px;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-size: 1rem;
    }

    .search-bar {
      position: relative;
      max-width: 600px;
      width: 100%;
    }
    .search-bar button {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #333;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #addyourreview{
        border-radius: 5px;
        border-color:#D8BFD8;
        color: black;
        background-color: #D8BFD8;
        padding: 10px;

    }
    body{
        /* background-color: rgb(17, 114, 17); */
        color: black;
    }
    #firstpart{
        display: flex;
        flex-direction: column;
        align-items: center;
        align-content: center;
        /* margin-top:100px; */
        background-color: #D8BFD8;
        color:BLACK;
        PADDING:100px;


    }
    #secondpart{
        display: flex;
        flex-direction: column;
        align-items: center;
        align-content: center;
    }
    </style>

</head>
<body>
    <script src="./landing.js"></script>
    

    <div id="firstpart">
    <h1>share your experience</h1>
    <h2>Help Others make Right Choice</h2>
    <div class="search-bar">
        <input type="text" id="companySearch" placeholder="Find a company to review">
        <button onclick="searchCompany()">
          <i class="bi bi-search"></i>
        </button>
      </div>

    </div>

      <div id="secondpart">
        <p>Can't find a company?</p>
        <p>It might not be listed on Trustpilot yet. Add it and be the first to write a review.</p>
      <button id="addyourreview" id="addreview">Add your Review</button>
    </div>
    


    <footer>
        <p>© 2025 Trustpilot, Inc. All rights reserved.</p>
    </footer>
    
</body>
</html>
